<span class="material-symbols-outlined text-emerald-900" data-icon="share">share</span>
</button>
</header>
<!-- Main Immersive Canvas -->
<main class="flex-grow relative overflow-hidden flex items-center justify-center p-6 bg-immersive" data-alt="A high-resolution, wide-angle cinematic shot of a sun-drenched tomato field at golden hour. In the foreground, a rustic wooden crate is overflowing with vibrant, vine-ripened red tomatoes, still sparkling with morning dew. The deep emerald green leaves of the tomato plants stretch into the distance under a clear, warm sky, creating a rich agrarian atmosphere that feels both premium and organic. The lighting is soft and golden, emphasizing the lush textures and natural colors of the harvest.">

<div class="absolute inset-0 bg-primary/20 backdrop-blur-[2px]"></div>

<div class="relative glass-card w-full max-w-md p-8 rounded-[2.5rem] shadow-2xl flex flex-col items-center text-center border border-white/30">

<div class="mb-6 flex items-center gap-2 bg-error text-white px-4 py-1.5 rounded-full shadow-lg">
<span class="w-2 h-2 bg-white rounded-full animate-ping"></span>
<span class="font-label font-black text-[10px] uppercase tracking-[0.2em]">LIVE</span>
</div>
<!-- Hero Text Section -->
<div class="space-y-4 mb-10">
<h2 class="font-display font-extrabold text-4xl leading-tight tracking-tight text-primary">

                </p>

<span class="material-symbols-outlined text-white" data-icon="live_tv">live_tv</span>

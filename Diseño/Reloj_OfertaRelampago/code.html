<!-- Sticky Bottom Action Bar for Multi-selection -->

<script>
        function toggleSelection(card) {
            const checkbox = card.querySelector('input[type="checkbox"]');
            checkbox.checked = !checkbox.checked;
            
            if (checkbox.checked) {
                card.classList.add('ring-2', 'ring-primary', 'bg-surface-low');
            } else {
                card.classList.remove('ring-2', 'ring-primary', 'bg-surface-low');
            }
            
            updateSelectionBar();
        }

        function updateSelectionBar() {
            const selectedCount = document.querySelectorAll('input[type="checkbox"]:checked').length;
            const bar = document.getElementById('selectionBar');
            
            if (selectedCount > 0) {
                bar.classList.remove('translate-y-full');
                bar.querySelector('.bg-primary-container').textContent = selectedCount;
                bar.querySelector('.font-headline-sm.text-on-surface').textContent = `${selectedCount} producto${selectedCount > 1 ? 's' : ''} seleccionado${selectedCount > 1 ? 's' : ''}`;
            } else {
                bar.classList.add('translate-y-full');
            }
        }
    </script>

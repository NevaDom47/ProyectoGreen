<!DOCTYPE html>

<html lang="es" style=""><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Registro de Proveedor - Mercadito</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed": "#002114",
                        "on-secondary-fixed": "#042015",
                        "surface-container-highest": "#e0e3df",
                        "primary-fixed": "#a5f3cb",
                        "primary-container": "#036042",
                        "on-secondary": "#ffffff",
                        "on-error": "#ffffff",
                        "primary": "#00462f",
                        "outline-variant": "#bec9c1",
                        "on-secondary-fixed-variant": "#314c3f",
                        "on-tertiary-fixed": "#3c0708",
                        "surface-container-low": "#f1f4f0",
                        "on-error-container": "#93000a",
                        "inverse-surface": "#2d312e",
                        "surface-container": "#ebefea",
                        "on-tertiary-container": "#ffb5b0",
                        "on-background": "#181d1a",
                        "on-tertiary-fixed-variant": "#75322f",
                        "on-tertiary": "#ffffff",
                        "error": "#ba1a1a",
                        "tertiary": "#682826",
                        "secondary-fixed": "#caead7",
                        "error-container": "#ffdad6",
                        "on-surface": "#181d1a",
                        "on-secondary-container": "#4e6b5b",
                        "on-primary-container": "#8bd8b2",
                        "surface-container-high": "#e6e9e4",
                        "secondary-fixed-dim": "#afcebb",
                        "on-primary": "#ffffff",
                        "secondary": "#486456",
                        "tertiary-fixed-dim": "#ffb3ae",
                        "surface-tint": "#186b4c",
                        "inverse-primary": "#89d6b0",
                        "on-surface-variant": "#3f4943",
                        "inverse-on-surface": "#eef2ed",
                        "surface": "#f7faf5",
                        "secondary-container": "#caead7",
                        "tertiary-container": "#853e3b",
                        "background": "#f7faf5",
                        "surface-dim": "#d7dbd6",
                        "surface-container-lowest": "#ffffff",
                        "surface-variant": "#e0e3df",
                        "outline": "#6f7a73",
                        "surface-bright": "#f7faf5",
                        "primary-fixed-dim": "#89d6b0",
                        "tertiary-fixed": "#ffdad7",
                        "on-primary-fixed-variant": "#005137"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans"],
                        "display": ["Plus Jakarta Sans"],
                        "body": ["Plus Jakarta Sans"],
                        "label": ["Plus Jakarta Sans"]
                    },
                    "animation": {
                        "fade-in-up": "fadeInUp 0.5s ease-out forwards",
                    },
                    "keyframes": {
                        fadeInUp: {
                            "0%": { opacity: "0", transform: "translateY(20px)" },
                            "100%": { opacity: "1", transform: "translateY(0)" },
                        }
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }
        .delay-500 { animation-delay: 500ms; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- Top AppBar (Back and Title) -->
<header class="flex items-center justify-between px-4 h-16 w-full bg-surface dark:bg-surface-dim sticky top-0 z-40 opacity-0 animate-fade-in-up">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors active:scale-95">
</button>
<div class="w-10"></div> <!-- Spacer for centering -->
</header><div class="mx-4 mt-4 p-8 bg-secondary-container rounded-xl flex items-center justify-center opacity-0 animate-fade-in-up delay-100"><h2 class="text-primary font-display text-2xl font-black uppercase tracking-tighter">Perfil de Proveedor</h2></div>
<main class="flex-grow flex items-center justify-center p-4">
<!-- Registration Card Container -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-sm p-6 md:p-8 opacity-0 animate-fade-in-up delay-200">
<!-- Header Section -->
<div class="mb-8 opacity-0 animate-fade-in-up delay-300">
<h2 class="font-headline text-2xl font-bold text-on-surface mb-2">Informacion de Negocio</h2>
<!-- Progress Indicator -->
<p class="font-body text-sm text-on-surface-variant">Completa tu información para comenzar como proveedor</p>
</div>
<!-- Form Section -->
<form class="space-y-6">
<!-- Name Field -->
<div class="space-y-1.5 opacity-0 animate-fade-in-up delay-300">
<label class="block text-xs font-bold text-on-surface-variant uppercase tracking-wider px-1">Nombre de negocio o personal</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors">corporate_fare</span>
</div>
<input class="block w-full pl-10 pr-4 py-3 bg-surface-container-low border border-transparent rounded-xl focus:ring-2 focus:ring-primary-container/50 focus:border-primary-container focus:bg-surface-container-lowest hover:bg-surface-container-low/80 text-on-surface placeholder:text-outline transition-all duration-300 ease-in-out shadow-sm focus:shadow-md" placeholder="Ej. Granja Los Olivos" type="text"/>
</div>
<p class="text-[10px] text-outline px-1">Este nombre será visible para tus clientes.</p>
</div>
<!-- Email Field -->
<div class="space-y-1.5 opacity-0 animate-fade-in-up delay-400">
<label class="block text-xs font-bold text-on-surface-variant uppercase tracking-wider px-1">Correo electrónico a mostrar</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors">mail</span>
</div>
<input class="block w-full pl-10 pr-4 py-3 bg-surface-container-low border border-transparent rounded-xl focus:ring-2 focus:ring-primary-container/50 focus:border-primary-container focus:bg-surface-container-lowest hover:bg-surface-container-low/80 text-on-surface placeholder:text-outline transition-all duration-300 ease-in-out shadow-sm focus:shadow-md" placeholder="contacto@tunegocio.com" type="email"/>
</div>
<p class="text-[10px] text-outline px-1">Utilizaremos este correo para comunicaciones comerciales.</p>
</div>
<!-- Phone Field -->
<div class="space-y-1.5 opacity-0 animate-fade-in-up delay-500">
<label class="block text-xs font-bold text-on-surface-variant uppercase tracking-wider px-1">Teléfono de contacto</label>
<div class="flex gap-2">
<div class="relative w-28 group">
<select class="block w-full pl-3 pr-8 py-3 bg-surface-container-low border border-transparent rounded-xl focus:ring-2 focus:ring-primary-container/50 focus:border-primary-container focus:bg-surface-container-lowest hover:bg-surface-container-low/80 text-on-surface appearance-none text-sm transition-all duration-300 ease-in-out shadow-sm focus:shadow-md">
<option>MX +52</option>
<option>US +1</option>
<option>CO +57</option>
<option>ES +34</option>
</select>
<div class="absolute inset-y-0 right-0 pr-2 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-sm group-focus-within:text-primary transition-colors">expand_more</span>
</div>
</div>
<div class="relative flex-grow group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors">phone</span>
</div>
<input class="block w-full pl-10 pr-4 py-3 bg-surface-container-low border border-transparent rounded-xl focus:ring-2 focus:ring-primary-container/50 focus:border-primary-container focus:bg-surface-container-lowest hover:bg-surface-container-low/80 text-on-surface placeholder:text-outline transition-all duration-300 ease-in-out shadow-sm focus:shadow-md" placeholder="55 1234 5678" type="tel"/>
</div>
</div>
</div>
<!-- Spacer -->
</form>
<!-- Decorative Image Anchor -->
</div>
</main><div class="p-6 pt-0 bg-background opacity-0 animate-fade-in-up delay-500">
<button class="w-full bg-primary-container text-on-primary-container font-label text-[10px] font-black uppercase tracking-widest py-4 rounded-xl shadow-sm hover:shadow-md hover:bg-primary-container/90 focus:outline-none focus:ring-4 focus:ring-primary-container/30 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2 transform" type="submit">
        Continuar
        <span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
<!-- Visual Footer Branding -->
</body></html>

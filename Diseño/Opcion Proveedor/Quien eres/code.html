<!DOCTYPE html>

<html lang="es" style=""><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mercadito - Registro Paso 2</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-fixed-dim": "#89d6b0",
                    "primary": "#00462f",
                    "on-secondary-fixed": "#042015",
                    "on-background": "#181d1a",
                    "on-error": "#ffffff",
                    "on-primary-container": "#8bd8b2",
                    "surface-variant": "#e0e3df",
                    "surface-bright": "#f7faf5",
                    "on-secondary-container": "#4e6b5b",
                    "on-tertiary-fixed": "#3c0708",
                    "tertiary-fixed-dim": "#ffb3ae",
                    "secondary-container": "#caead7",
                    "on-surface": "#181d1a",
                    "on-primary": "#ffffff",
                    "inverse-primary": "#89d6b0",
                    "surface": "#f7faf5",
                    "outline-variant": "#bec9c1",
                    "primary-fixed": "#a5f3cb",
                    "surface-container-lowest": "#ffffff",
                    "tertiary-container": "#853e3b",
                    "surface-tint": "#186b4c",
                    "surface-container-low": "#f1f4f0",
                    "on-secondary": "#ffffff",
                    "on-primary-fixed-variant": "#005137",
                    "on-secondary-fixed-variant": "#314c3f",
                    "on-tertiary": "#ffffff",
                    "error-container": "#ffdad6",
                    "secondary": "#486456",
                    "background": "#f7faf5",
                    "primary-container": "#036042",
                    "surface-dim": "#d7dbd6",
                    "inverse-on-surface": "#eef2ed",
                    "secondary-fixed-dim": "#afcebb",
                    "on-surface-variant": "#3f4943",
                    "surface-container-highest": "#e0e3df",
                    "on-tertiary-fixed-variant": "#75322f",
                    "on-tertiary-container": "#ffb5b0",
                    "surface-container": "#ebefea",
                    "secondary-fixed": "#caead7",
                    "inverse-surface": "#2d312e",
                    "outline": "#6f7a73",
                    "error": "#ba1a1a",
                    "tertiary-fixed": "#ffdad7",
                    "tertiary": "#682826",
                    "on-primary-fixed": "#002114",
                    "on-error-container": "#93000a",
                    "surface-container-high": "#e6e9e4"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Plus Jakarta Sans", "sans-serif"],
                    "display": ["Plus Jakarta Sans", "sans-serif"],
                    "body": ["Plus Jakarta Sans", "sans-serif"],
                    "label": ["Plus Jakarta Sans", "sans-serif"]
            },
            "animation": {
              'fade-in-up': 'fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'progress-fill': 'progressFill 1s cubic-bezier(0.16, 1, 0.3, 1) forwards'
            },
            "keyframes": {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(16px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              progressFill: {
                '0%': { width: '25%' },
                '100%': { width: '50%' }
              }
            }
          }
        }
      }
    </script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr; -webkit-font-smoothing: antialiased; }
        
        .stagger-1 { animation-delay: 100ms; opacity: 0; }
        .stagger-2 { animation-delay: 200ms; opacity: 0; }
        .stagger-3 { animation-delay: 300ms; opacity: 0; }
        .stagger-4 { animation-delay: 400ms; opacity: 0; }
        .stagger-5 { animation-delay: 500ms; opacity: 0; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
<!-- TopAppBar from JSON -->
<main class="flex-grow w-full max-w-md mx-auto pb-32">
<!-- Progress Indicator -->
<div class="px-6 pt-6 pb-4 animate-fade-in-up stagger-1">
<div class="flex justify-between items-end mb-3">
<span class="font-label text-[10px] font-black uppercase tracking-widest text-secondary">Paso 2 de registro</span>
<span class="font-label text-[10px] font-black text-secondary">50%</span>
</div>
<div class="w-full bg-surface-container-high rounded-full h-1.5 overflow-hidden">
<div class="bg-primary h-full rounded-full animate-progress-fill" style="width: 25%;"></div>
</div>
</div>
<!-- Header -->
<div class="px-6 py-4 mb-2 animate-fade-in-up stagger-2">
<h2 class="font-display text-2xl font-extrabold text-primary mb-3">¿Quién eres?</h2>
<p class="font-body text-[14px] leading-relaxed text-on-surface-variant">Cuéntanos más sobre tu negocio y los productos o servicios que ofreces.</p>
</div>
<!-- Form Fields -->
<div class="px-6 space-y-6">
<!-- Especialidad Dropdown (Custom UI) -->
<div class="animate-fade-in-up stagger-3">
<label class="block font-label text-[10px] font-black uppercase tracking-widest text-on-surface mb-2 pl-1 transition-colors duration-300">Especialidad</label>
<div class="group flex items-center w-full bg-surface-container-lowest border border-outline-variant/30 rounded-xl px-4 py-3.5 shadow-sm cursor-pointer hover:bg-surface-container-lowest/80 hover:shadow hover:scale-[1.01] hover:border-primary/30 active:scale-[0.99] transition-all duration-300 ease-out focus-within:ring-2 focus-within:ring-primary/20 focus-within:border-primary/50" tabindex="0">
<span class="material-symbols-outlined text-secondary mr-3 group-hover:text-primary transition-colors duration-300" style='font-variation-settings: "FILL" 1;'>category</span>
<span class="font-body text-[14px] text-on-surface-variant flex-grow select-none group-hover:text-on-surface transition-colors duration-300">Selecciona una especialidad</span>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-all duration-300 group-active:rotate-180">expand_more</span>
</div>
</div>
<!-- Tipo de venta Dropdown (Custom UI) -->
<div class="animate-fade-in-up stagger-4">
<label class="block font-label text-[10px] font-black uppercase tracking-widest text-on-surface mb-2 pl-1 transition-colors duration-300">Tipo de venta</label>
<div class="group flex items-center w-full bg-surface-container-lowest border border-outline-variant/30 rounded-xl px-4 py-3.5 shadow-sm cursor-pointer hover:bg-surface-container-lowest/80 hover:shadow hover:scale-[1.01] hover:border-primary/30 active:scale-[0.99] transition-all duration-300 ease-out focus-within:ring-2 focus-within:ring-primary/20 focus-within:border-primary/50" tabindex="0">
<span class="material-symbols-outlined text-secondary mr-3 group-hover:text-primary transition-colors duration-300" style='font-variation-settings: "FILL" 1;'>storefront</span>
<span class="font-body text-[14px] text-on-surface-variant flex-grow select-none group-hover:text-on-surface transition-colors duration-300">Selecciona el tipo de venta</span>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-all duration-300 group-active:rotate-180">expand_more</span>
</div>
</div>
<!-- Descripción del negocio Textarea -->
<div class="animate-fade-in-up stagger-5">
<label class="block font-label text-[10px] font-black uppercase tracking-widest text-on-surface mb-2 pl-1 transition-colors duration-300">Descripción del negocio</label>
<div class="relative bg-surface-container-lowest border border-outline-variant/30 rounded-xl p-1 shadow-sm hover:shadow hover:border-primary/30 transition-all duration-300 ease-out focus-within:ring-4 focus-within:ring-primary/20 focus-within:border-primary focus-within:shadow-md group">
<div class="absolute top-3.5 left-4 transition-transform duration-300 group-focus-within:-translate-y-0.5">
<span class="material-symbols-outlined text-secondary group-focus-within:text-primary transition-colors duration-300" style='font-variation-settings: "FILL" 1;'>edit_document</span>
</div>
<textarea class="w-full bg-transparent border-none focus:ring-0 font-body text-[14px] text-on-surface placeholder:text-outline pl-12 pr-4 py-3.5 resize-none h-32 rounded-xl transition-colors duration-300" placeholder="Habla sobre tu negocio, a qué te dedicas y qué vendes…"></textarea>
</div>
<p class="font-label text-[10px] text-on-surface-variant mt-2 pl-1 flex items-center gap-1.5 opacity-80 hover:opacity-100 transition-opacity duration-300">
<span class="material-symbols-outlined text-[14px]">info</span>
                    Esta información ayudará a los compradores a conocerte mejor.
                </p>
</div>
</div>
</main>
<!-- BottomNavBar from JSON -->
<nav class="fixed bottom-0 w-full flex justify-between items-center px-6 py-4 pb-safe bg-surface-container-lowest dark:bg-surface-container-lowest shadow-[0_-4px_20px_rgba(0,0,0,0.05)] rounded-t-xl z-50">
<!-- Inactive: Atrás -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-6 py-2 hover:opacity-90 active:scale-95 transition-all duration-300 ease-out hover:text-primary">
<span class="material-symbols-outlined mb-1 transition-transform duration-300 group-hover:-translate-x-1">chevron_left</span>
<span class="Plus Jakarta Sans font-label text-[10px] font-black uppercase tracking-widest text-current">Atrás</span>
</button>
<!-- Active: Continuar -->
<button class="group flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-8 py-3 shadow-md hover:shadow-lg hover:bg-primary-container/90 active:scale-95 active:shadow-sm transition-all duration-300 ease-out">
<div class="flex items-center gap-2">
<span class="Plus Jakarta Sans font-label text-[10px] font-black uppercase tracking-widest">Continuar</span>
<span class="material-symbols-outlined text-[18px] transition-transform duration-300 group-hover:translate-x-1 group-active:translate-x-0">chevron_right</span>
</div>
</button>
</nav>
</body></html>

<script>
        // Simple mock countdown timer script
        function startTimer(duration, displayElementId) {
            let timer = duration, hours, minutes, seconds;
            const display = document.getElementById(displayElementId);
            if(!display) return;

            setInterval(function () {
                hours = parseInt(timer / 3600, 10);
                minutes = parseInt((timer % 3600) / 60, 10);
                seconds = parseInt(timer % 60, 10);

                hours = hours < 10 ? "0" + hours : hours;
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                display.textContent = hours + ":" + minutes + ":" + seconds;

                if (--timer < 0) {
                    timer = 0; // Stop at zero in real scenario
                }
            }, 1000);
        }

        // Initialize mock timers on load
        window.onload = function () {
            // Timer 1: ~4 hours left
            let time1 = (4 * 3600) + (22 * 60) + 15; 
            startTimer(time1, 'timer1');
            
            // Timer 2: ~1 hour 45 mins left
            let time2 = (1 * 3600) + (45 * 60) + 0;
            startTimer(time2, 'timer2');
        };
    </script>

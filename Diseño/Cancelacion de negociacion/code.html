<body class="bg-background text-on-background min-h-screen pb-safe">
<!-- TopAppBar from JSON -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-4 h-16 bg-background dark:bg-background bg-surface-container-low dark:bg-surface-dim">
<button aria-label="Go back" class="flex items-center justify-center p-2 text-on-surface-variant dark:text-outline hover:bg-surface-variant/50 transition-colors rounded-full">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="font-headline text-lg font-bold tracking-tight text-primary dark:text-primary-fixed-dim">Negotiation</h1>
<button aria-label="Help" class="flex items-center justify-center p-2 text-on-surface-variant dark:text-outline hover:bg-surface-variant/50 transition-colors rounded-full">
<span class="material-symbols-outlined">help_outline</span>
</button>
</header>
<main class="pt-20 px-4 max-w-2xl mx-auto pb-24">
<div class="mb-8">
<h2 class="font-display text-2xl font-extrabold text-on-background mb-2">Cancelar Negociación</h2>
<p class="font-body text-sm text-on-surface-variant">Lamentamos que la negociación no haya concluido. Por favor, ayúdanos a entender el motivo.</p>
</div>
<!-- Product Preview Card -->
<div class="bg-surface-container-lowest rounded-xl p-4 shadow-sm flex gap-4 mb-8">
<div class="w-24 h-24 rounded-lg bg-surface-container-low overflow-hidden shrink-0">
<img alt="Fresh Tomatoes" class="w-full h-full object-cover" data-alt="A macro close-up of vibrantly red, freshly harvested saladette tomatoes resting in a rustic wooden crate. The lighting is natural and bright, highlighting the dewy water droplets on the skin of the tomatoes, conveying extreme freshness and organic quality. The background is slightly blurred but suggests a sunlit agricultural market setting. The overall aesthetic is rich, organic, and highly detailed, perfectly matching a premium food commerce platform." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCPABOSkPU07Uk-TLGgUJzkXBKpGhuFBiWgoDxAIyBdDVTuL43OCvU2SzPCLgZ2eV4FrU82mHcFm3jl6NulpG2PGQ6bA89Vqgekax3HFD8Tob-DMQ864R9kxKx_efUyVvxeXb7p_1h48Jl7pm23aRj7x6SSS51rL2P4HSeFreWD91waWO81ga9GQ5IzKtB9AdAyV6RDtFiCYFc6RYixTXPxEXVSSlK95gbprFj9de3Nd0mCyxLeVO6oDzgRMqnOraA8z5TsbvZUw90"/>
</div>
<div class="flex flex-col justify-center">
<span class="font-label text-[10px] font-black uppercase tracking-widest text-secondary mb-1">Producto</span>
<h3 class="font-headline font-bold text-on-background">Tomate Saladette</h3>
<div class="mt-2 inline-flex items-center gap-1">
<span class="material-symbols-outlined text-sm text-on-surface-variant">payments</span>
<span class="font-body text-sm font-semibold text-on-background">$28.50 / kg</span>
</div>
</div>
</div>
<!-- Cancellation Reasons -->
<div class="mb-8">
<h3 class="font-headline font-bold text-on-background mb-4">Motivo de la cancelación</h3>
<div class="flex flex-col gap-3">
<label class="flex items-center p-3 rounded-lg border border-outline-variant/20 bg-surface-container-lowest cursor-pointer hover:bg-surface-container-low transition-colors">
<input class="w-5 h-5 text-primary border-outline focus:ring-primary focus:ring-offset-background" name="cancel_reason" type="radio"/>
<span class="ml-3 font-body text-sm text-on-background">Encontré un mejor precio</span>
</label>
<label class="flex items-center p-3 rounded-lg border border-outline-variant/20 bg-surface-container-lowest cursor-pointer hover:bg-surface-container-low transition-colors">
<input class="w-5 h-5 text-primary border-outline focus:ring-primary focus:ring-offset-background" name="cancel_reason" type="radio"/>
<span class="ml-3 font-body text-sm text-on-background">El producto ya no está disponible</span>
</label>
<label class="flex items-center p-3 rounded-lg border border-outline-variant/20 bg-surface-container-lowest cursor-pointer hover:bg-surface-container-low transition-colors">
<input class="w-5 h-5 text-primary border-outline focus:ring-primary focus:ring-offset-background" name="cancel_reason" type="radio"/>
<span class="ml-3 font-body text-sm text-on-background">Cambio de planes</span>
</label>
<label class="flex items-center p-3 rounded-lg border border-outline-variant/20 bg-surface-container-lowest cursor-pointer hover:bg-surface-container-low transition-colors">
<input class="w-5 h-5 text-primary border-outline focus:ring-primary focus:ring-offset-background" name="cancel_reason" type="radio"/>
<span class="ml-3 font-body text-sm text-on-background">Problemas con el envío</span>
</label>
<label class="flex items-center p-3 rounded-lg border border-outline-variant/20 bg-surface-container-lowest cursor-pointer hover:bg-surface-container-low transition-colors">
<input class="w-5 h-5 text-primary border-outline focus:ring-primary focus:ring-offset-background" id="reason_other" name="cancel_reason" type="radio"/>
<span class="ml-3 font-body text-sm text-on-background">Otro (especificar)</span>
</label>
</div>
</div>
<!-- Additional Comments -->
<div class="mb-10">
<h3 class="font-headline font-bold text-on-background mb-2">Comentarios adicionales</h3>
<textarea class="w-full h-32 p-4 rounded-xl border border-outline-variant/50 bg-surface-container-lowest font-body text-sm text-on-background focus:border-primary focus:ring-1 focus:ring-primary resize-none" placeholder="Cuéntanos más..."></textarea>
</div>
<!-- Actions -->
<div class="flex flex-col gap-4">
<button class="w-full py-4 rounded-xl bg-error-container text-on-error-container font-label text-[12px] font-black uppercase tracking-widest hover:opacity-90 transition-opacity">
                Confirmar Cancelación
            </button>
<button class="w-full py-4 rounded-xl bg-transparent text-on-surface-variant font-label text-[12px] font-black uppercase tracking-widest hover:bg-surface-variant/50 transition-colors">
                Volver
            </button>
</div>

<!-- Suppressed Bottom Navigation - This is a transactional flow (cancellation) -->

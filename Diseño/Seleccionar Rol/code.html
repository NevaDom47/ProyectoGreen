<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>El Mercadito - Role Selection</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#e0e3df",
                        "error-container": "#ffdad6",
                        "on-secondary-container": "#4e6b5b",
                        "tertiary": "#682826",
                        "secondary-container": "#caead7",
                        "inverse-on-surface": "#eef2ed",
                        "primary-container": "#036042",
                        "secondary-fixed-dim": "#afcebb",
                        "inverse-primary": "#89d6b0",
                        "surface-bright": "#f7faf5",
                        "primary": "#00462f",
                        "on-primary-container": "#8bd8b2",
                        "on-error-container": "#93000a",
                        "surface-container-low": "#f1f4f0",
                        "on-surface-variant": "#3f4943",
                        "on-primary-fixed": "#002114",
                        "on-primary-fixed-variant": "#005137",
                        "on-tertiary-container": "#ffb5b0",
                        "inverse-surface": "#2d312e",
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed-variant": "#75322f",
                        "tertiary-fixed": "#ffdad7",
                        "tertiary-container": "#853e3b",
                        "surface-container-high": "#e6e9e4",
                        "surface-tint": "#186b4c",
                        "tertiary-fixed-dim": "#ffb3ae",
                        "error": "#ba1a1a",
                        "surface-container-highest": "#e0e3df",
                        "on-primary": "#ffffff",
                        "background": "#f7faf5",
                        "surface-container": "#ebefea",
                        "on-error": "#ffffff",
                        "on-background": "#181d1a",
                        "primary-fixed": "#a5f3cb",
                        "secondary": "#486456",
                        "surface-dim": "#d7dbd6",
                        "surface": "#f7faf5",
                        "on-secondary-fixed-variant": "#314c3f",
                        "outline-variant": "#bec9c1",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed-dim": "#89d6b0",
                        "on-secondary-fixed": "#042015",
                        "secondary-fixed": "#caead7",
                        "on-tertiary-fixed": "#3c0708",
                        "on-tertiary": "#ffffff",
                        "on-surface": "#181d1a",
                        "outline": "#6f7a73"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans", "sans-serif"],
                        "display": ["Plus Jakarta Sans", "sans-serif"],
                        "body": ["Plus Jakarta Sans", "sans-serif"],
                        "label": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    "keyframes": {
                        "fade-up": {
                            "0%": { opacity: "0", transform: "translateY(20px)" },
                            "100%": { opacity: "1", transform: "translateY(0)" }
                        }
                    },
                    "animation": {
                        "fade-up": "fade-up 0.6s ease-out forwards"
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
    .stagger-1 { animation-delay: 0.1s; opacity: 0; }
    .stagger-2 { animation-delay: 0.3s; opacity: 0; }
    .stagger-3 { animation-delay: 0.5s; opacity: 0; }
    .stagger-4 { animation-delay: 0.7s; opacity: 0; }
  </style>
</head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col overflow-x-hidden">
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center p-4 md:p-8 w-full max-w-3xl mx-auto">
<!-- Header Section -->
<div class="text-center mb-8 md:mb-12 w-full animate-fade-up stagger-1">
<h1 class="font-headline text-2xl md:text-3xl font-bold text-primary mb-3">¿Cómo quieres participar?</h1>
<p class="font-body text-sm md:text-base text-on-surface-variant max-w-lg mx-auto">Elige tu rol para personalizar tu experiencia en el campo digital.</p>
</div>
<!-- Role Selection Cards Container -->
<div class="w-full flex flex-col md:flex-row gap-6 mb-12">
<!-- Comprador Card -->
<label class="relative flex-1 cursor-pointer group animate-fade-up stagger-2">
<input class="peer sr-only" name="role" type="radio" value="comprador"/>
<div class="h-full bg-surface-container-lowest rounded-xl p-6 shadow-sm border-2 border-outline-variant peer-checked:border-primary peer-checked:bg-secondary-container/20 peer-checked:shadow-lg peer-checked:shadow-primary/5 hover:border-primary/50 hover:scale-[1.02] active:scale-[0.98] transition-all duration-300 flex flex-col items-center text-center">
<div class="w-16 h-16 rounded-full bg-surface-container-high flex items-center justify-center mb-4 group-hover:bg-primary/10 transition-colors duration-300">
<span class="material-symbols-outlined text-3xl text-on-surface-variant group-hover:text-primary transition-colors duration-300">shopping_basket</span>
</div>
<h2 class="font-headline text-lg font-bold text-primary mb-2 transition-colors duration-300">Comprador</h2>
<p class="font-body text-sm text-on-surface-variant mb-6">Busca productos frescos directamente de la granja, negocia precios en tiempo real y recibe tu cosecha en casa.</p>
<div class="mt-auto w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary transition-all duration-300">
<span class="material-symbols-outlined text-white text-lg scale-0 peer-checked:scale-100 transition-transform duration-300 ease-out">check</span>
</div>
</div>
</label>
<!-- Proveedor Card -->
<label class="relative flex-1 cursor-pointer group animate-fade-up stagger-3">
<input class="peer sr-only" name="role" type="radio" value="proveedor"/>
<div class="h-full bg-surface-container-lowest rounded-xl p-6 shadow-sm border-2 border-outline-variant peer-checked:border-primary peer-checked:bg-secondary-container/20 peer-checked:shadow-lg peer-checked:shadow-primary/5 hover:border-primary/50 hover:scale-[1.02] active:scale-[0.98] transition-all duration-300 flex flex-col items-center text-center">
<div class="w-16 h-16 rounded-full bg-surface-container-high flex items-center justify-center mb-4 group-hover:bg-primary/10 transition-colors duration-300">
<span class="material-symbols-outlined text-3xl text-on-surface-variant group-hover:text-primary transition-colors duration-300">agriculture</span>
</div>
<h2 class="font-headline text-lg font-bold text-primary mb-2 transition-colors duration-300">Proveedor</h2>
<p class="font-body text-sm text-on-surface-variant mb-6">Publica tus cosechas, gestiona negociaciones con compradores y accede a herramientas de análisis para hacer crecer tu negocio.</p>
<div class="mt-auto w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary transition-all duration-300">
<span class="material-symbols-outlined text-white text-lg scale-0 peer-checked:scale-100 transition-transform duration-300 ease-out">check</span>
</div>
</div>
</label>
</div>
<!-- Action Area -->
<div class="w-full max-w-md mx-auto mt-auto md:mt-0 animate-fade-up stagger-4">
<button class="w-full bg-primary text-on-primary font-label text-base font-extrabold uppercase tracking-widest py-5 px-8 rounded-full shadow-2xl hover:bg-surface-tint hover:shadow-primary/20 active:scale-95 transition-all duration-300 focus:outline-none focus:ring-4 focus:ring-primary/30">
                CONTINUAR
            </button>
</div>
</main>
</body></html>

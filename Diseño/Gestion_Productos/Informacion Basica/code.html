<!DOCTYPE html><html class="light" lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Gestionar Producto - El Mercadito</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
                "secondary": "#486456",
                "on-surface": "#181d1a",
                "on-secondary-fixed-variant": "#314c3f",
                "on-primary-fixed-variant": "#005137",
                "inverse-primary": "#89d6b0",
                "surface-tint": "#186b4c",
                "surface-dim": "#d7dbd6",
                "background": "#f7faf5",
                "on-error": "#ffffff",
                "secondary-fixed-dim": "#afcebb",
                "outline-variant": "#bec9c1",
                "error": "#ba1a1a",
                "surface-container": "#ebefea",
                "outline": "#6f7a73",
                "on-tertiary-fixed": "#3c0708",
                "surface-bright": "#f7faf5",
                "on-background": "#181d1a",
                "tertiary-fixed": "#ffdad7",
                "inverse-on-surface": "#eef2ed",
                "secondary-fixed": "#caead7",
                "on-error-container": "#93000a",
                "surface-container-highest": "#e0e3df",
                "on-primary": "#ffffff",
                "on-tertiary-container": "#ffb5b0",
                "tertiary-container": "#853e3b",
                "error-container": "#ffdad6",
                "secondary-container": "#caead7",
                "on-primary-container": "#8bd8b2",
                "tertiary-fixed-dim": "#ffb3ae",
                "primary-fixed-dim": "#89d6b0",
                "on-secondary-fixed": "#042015",
                "on-surface-variant": "#3f4943",
                "primary": "#00462f",
                "primary-container": "#036042",
                "on-secondary": "#ffffff",
                "on-secondary-container": "#4e6b5b",
                "primary-fixed": "#a5f3cb",
                "surface-variant": "#e0e3df",
                "surface-container-low": "#f1f4f0",
                "surface-container-lowest": "#ffffff",
                "tertiary": "#682826",
                "on-primary-fixed": "#002114",
                "surface-container-high": "#e6e9e4",
                "inverse-surface": "#2d312e",
                "on-tertiary-fixed-variant": "#75322f",
                "surface": "#f7faf5",
                "on-tertiary": "#ffffff"
        },
        "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
        },
        "spacing": {},
        "fontFamily": {
                "headline": [
                        "Plus Jakarta Sans"
                ],
                "display": [
                        "Plus Jakarta Sans"
                ],
                "body": [
                        "Plus Jakarta Sans"
                ],
                "label": [
                        "Plus Jakarta Sans"
                ]
        },
        "fontSize": {}
},
    },
  }
</script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen pb-24 md:pb-0 relative">
<!-- TopAppBar -->
<header class="fixed top-0 w-full bg-surface dark:bg-surface-dim z-50 bg-surface-container-low dark:bg-surface-container border-b border-outline-variant/30">

</header>
<main class="pt-16 px-4 max-w-2xl mx-auto space-y-4">
<!-- Section: Photos Side-Scrolling -->
<section class="-mx-4 px-4 overflow-hidden">

</section>
<!-- Bento Grid Form -->
<div class="grid grid-cols-2 gap-3">
<!-- Bento: Basic Info (Full width) -->
<div class="col-span-2 bg-surface-container-lowest rounded-xl p-3 shadow-sm border border-outline-variant/30 space-y-3">
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-primary text-[18px]">info</span>
<h2 class="font-headline font-semibold text-sm text-on-surface">Información Básica</h2>
</div>
<div class="space-y-1">
<label class="text-[9px] font-label font-bold uppercase tracking-wider text-on-surface-variant" for="product-name">Nombre</label>
<input class="w-full bg-surface-container-low border border-outline-variant/40 rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-primary focus:border-primary text-on-surface placeholder-outline" id="product-name" type="text" value="Limones Colima">
</div>
<div class="grid grid-cols-2 gap-3">
<div class="space-y-1">
<label class="text-[9px] font-label font-bold uppercase tracking-wider text-on-surface-variant" for="category">Categoría</label>
<div class="relative">
<select class="w-full bg-surface-container-low border border-outline-variant/40 rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-primary focus:border-primary text-on-surface appearance-none" id="category">
<option>Frutas</option>
<option>Vegetales</option>
<option>Cítricos</option>
</select>
<span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none text-[18px]">arrow_drop_down</span>
</div>
</div>
<div class="space-y-1">
<label class="text-[9px] font-label font-bold uppercase tracking-wider text-on-surface-variant" for="sku">SKU</label>
<input class="w-full bg-surface-container-low border border-outline-variant/40 rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-primary focus:border-primary text-on-surface font-mono" id="sku" type="text" value="LIM-COL-01">
</div>
</div>
</div>
<!-- Bento: Precios (Left col) -->
<div class="col-span-1 bg-surface-container-lowest rounded-xl p-3 shadow-sm border border-outline-variant/30 space-y-3">
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-primary text-[18px]">payments</span>
<h2 class="font-headline font-semibold text-sm text-on-surface">Precio</h2>
</div>
<div class="space-y-1">
<label class="text-[9px] font-label font-bold uppercase tracking-wider text-on-surface-variant" for="price">Venta ($)</label>
<input class="w-full bg-surface-container-low border border-outline-variant/40 rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-primary focus:border-primary text-on-surface font-mono" id="price" step="0.10" type="number" value="3.20">
</div>
<div class="space-y-1">
<label class="text-[9px] font-label font-bold uppercase tracking-wider text-on-surface-variant" for="unit">Unidad</label>
<div class="relative">
<select class="w-full bg-surface-container-low border border-outline-variant/40 rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-primary focus:border-primary text-on-surface appearance-none" id="unit">
<option>kg</option>
<option>lb</option>
<option>caja</option>
</select>
<span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none text-[18px]">arrow_drop_down</span>
</div>
</div>
</div>
<!-- Bento: Calidad e Inventario (Right col) -->
<div class="col-span-1 bg-surface-container-lowest rounded-xl p-3 shadow-sm border border-outline-variant/30 space-y-3">
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-primary text-[18px]">inventory_2</span>
<h2 class="font-headline font-semibold text-sm text-on-surface">Inventario</h2>
</div>
<div class="space-y-1">
<label class="text-[9px] font-label font-bold uppercase tracking-wider text-on-surface-variant" for="stock">Stock Actual</label>
<input class="w-full bg-surface-container-low border border-outline-variant/40 rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-primary focus:border-primary text-on-surface font-mono" id="stock" type="number" value="150">
</div>
<div class="space-y-1">
<label class="text-[9px] font-label font-bold uppercase tracking-wider text-on-surface-variant" for="quality">Calidad</label>
<div class="relative">
<select class="w-full bg-surface-container-low border border-outline-variant/40 rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-primary focus:border-primary text-on-surface appearance-none" id="quality">
<option>Primera</option>
<option>Segunda</option>
<option>Orgánico</option>
</select>
<span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none text-[18px]">arrow_drop_down</span>
</div>
</div>
</div>
</div>
</main>
<!-- Floating Preview Button -->

<!-- Bottom Action Button (Sticky) -->



</body></html>

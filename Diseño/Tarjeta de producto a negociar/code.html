<header class="bg-surface dark:bg-background fixed top-0 w-full z-50 bg-surface-container-low dark:bg-surface-container flex items-center justify-between px-4 h-16 w-full shadow-sm">
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-high transition-colors active:scale-95 duration-150 p-2 rounded-full flex items-center justify-center">

</button>
</header>
<main class="flex-grow px-4 max-w-2xl mx-auto w-full flex flex-col gap-6">

<div class="flex flex-col">

<div class="flex flex-col flex-grow justify-between py-1">
<div>

<div class="flex flex-col gap-1">

</div>
<div class="flex items-center gap-2">
<span class="font-label text-[10px] font-bold text-on-surface-variant uppercase">Cantidad:</span>
<span class="font-body text-sm font-semibold text-on-surface">80 sacos</span>
</div>
</div>
</div>
</div>
<!-- Product Image (Now on right) -->

</div>
</div>
<!-- Total Highlight at bottom -->
<div class="bg-primary-container/10 border-t border-outline-variant/20 p-3 flex justify-between items-center">
<span class="font-headline font-bold text-sm text-on-surface">Total a Pagar</span>
<span class="font-headline font-extrabold text-xl text-primary">$1,800.00</span>
</div>
</div>
</div>
<!-- Chat Area Simulation -->
<div class="flex flex-col gap-4 mt-2">
<!-- Received Message -->
<div class="flex gap-3">
<div class="w-8 h-8 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center font-bold text-sm">
                    JP
                </div>
<div class="bg-surface-container-high rounded-2xl rounded-tl-sm p-3 max-w-[85%] text-sm font-body text-on-surface">
                    Podemos negociar el precio a $23.00 si compras más de 50 sacos. ¿Te interesa?
                </div>
</div>
<!-- Sent Message -->
<div class="flex gap-3 justify-end">
<div class="bg-primary text-on-primary rounded-2xl rounded-tr-sm p-3 max-w-[85%] text-sm font-body">
                    Necesitaría unos 80 sacos para esta semana. Si cerramos en $22.50, hacemos el trato ahora mismo.
                </div>
</div>
</div>
</main>
<!-- Chat Input Area -->
<div class="fixed bottom-0 w-full bg-surface border-t border-surface-container-highest p-4 pb-safe flex items-center gap-3 z-40">

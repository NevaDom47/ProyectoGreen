<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#016042",
                        "background-light": "#f5f8f7",
                        "background-dark": "#0f231d",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<title>El Mercadito - Registro</title>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden">
<!-- Top Navigation -->
<div class="flex items-center bg-primary p-4 pb-6 pt-8 justify-between rounded-b-xl shadow-lg">
<div class="text-white flex size-10 shrink-0 items-center justify-center cursor-pointer">
<span class="material-symbols-outlined">arrow_back</span>
</div>
<div class="flex flex-col items-center flex-1 pr-10">
<div class="w-12 h-12 mb-2 bg-white/20 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-white text-3xl">storefront</span>
</div>
<h2 class="text-white text-xl font-bold leading-tight tracking-tight">Crear cuenta nueva</h2>
<p class="text-white/80 text-xs mt-1">Únete a El Mercadito</p>
</div>
</div>
<!-- Banner Image / Illustration -->
<div class="@container">
<div class="@[480px]:px-4 @[480px]:py-6 px-4 py-4">
<div class="w-full bg-center bg-no-repeat bg-cover flex flex-col justify-end overflow-hidden rounded-xl min-h-[160px] shadow-sm" data-alt="Close up of fresh green vegetables in a market basket" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAYjEvl6GqW5CMVrL5GOdDov67oCvtBLLBP3YjBKSHMn4wqbdZJWu5BkTVHmsrtHHlk3cXiPeDLh6ZrVIwaoAohEig_BIXyHfn8rFByjod8KEw0NjE0Z8Rcb_wY0DVRSYwHZknzv_XjMURYKbFRRlA2p20EsZGWrxaxEJErOby4apO1RCpM8Taa2e7xXWvZam0UkOocPSXRQPBHPUlExyQpRsnFfeB5uQ3UJgzgYfsL6WBrK-01xLDU-Re8zVMtUjWvuRyqJQ67Cts");'>
<div class="bg-gradient-to-t from-primary/80 to-transparent p-4">
<p class="text-white font-semibold text-sm">Productos frescos desde el productor hasta tu mesa</p>
</div>
</div>
</div>
</div>
<!-- Registration Form -->
<div class="flex flex-col gap-2 px-4 pb-10">
<!-- Nombre de Usuario -->
<div class="flex flex-col gap-1.5 py-2">
<label class="text-primary dark:text-primary/90 text-sm font-semibold ml-1">Nombre de Usuario</label>
<div class="flex w-full items-stretch rounded-lg shadow-sm border border-primary/20 bg-white dark:bg-slate-800/50 overflow-hidden focus-within:ring-2 focus-within:ring-primary/30 transition-all">
<div class="text-primary/60 flex items-center justify-center pl-4 pr-2">
<span class="material-symbols-outlined text-[20px]">person</span>
</div>
<input class="form-input flex w-full border-none bg-transparent h-12 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 focus:ring-0 text-sm" placeholder="Ej. juan_perez" type="text"/>
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-1.5 py-2">
<label class="text-primary dark:text-primary/90 text-sm font-semibold ml-1">Correo Electrónico</label>
<div class="flex w-full items-stretch rounded-lg shadow-sm border border-primary/20 bg-white dark:bg-slate-800/50 overflow-hidden focus-within:ring-2 focus-within:ring-primary/30 transition-all">
<div class="text-primary/60 flex items-center justify-center pl-4 pr-2">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="form-input flex w-full border-none bg-transparent h-12 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 focus:ring-0 text-sm" placeholder="correo@ejemplo.com" type="email"/>
</div>
</div>
<!-- Contraseña -->
<div class="flex flex-col gap-1.5 py-2">
<label class="text-primary dark:text-primary/90 text-sm font-semibold ml-1">Contraseña</label>
<div class="flex w-full items-stretch rounded-lg shadow-sm border border-primary/20 bg-white dark:bg-slate-800/50 overflow-hidden focus-within:ring-2 focus-within:ring-primary/30 transition-all">
<div class="text-primary/60 flex items-center justify-center pl-4 pr-2">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="form-input flex w-full border-none bg-transparent h-12 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 focus:ring-0 text-sm" placeholder="Crea una contraseña" type="password"/>
<div class="text-primary/40 flex items-center justify-center pr-4 cursor-pointer hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</div>
</div>
</div>
<!-- Confirmar Contraseña -->
<div class="flex flex-col gap-1.5 py-2">
<label class="text-primary dark:text-primary/90 text-sm font-semibold ml-1">Confirmar Contraseña</label>
<div class="flex w-full items-stretch rounded-lg shadow-sm border border-primary/20 bg-white dark:bg-slate-800/50 overflow-hidden focus-within:ring-2 focus-within:ring-primary/30 transition-all">
<div class="text-primary/60 flex items-center justify-center pl-4 pr-2">
<span class="material-symbols-outlined text-[20px]">lock_reset</span>
</div>
<input class="form-input flex w-full border-none bg-transparent h-12 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 focus:ring-0 text-sm" placeholder="Repite tu contraseña" type="password"/>
</div>
</div>
<!-- Submit Button -->
<div class="mt-6 flex flex-col gap-4">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-transform active:scale-[0.98] flex items-center justify-center gap-2">
<span>Crear cuenta</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<p class="text-center text-sm text-slate-500 dark:text-slate-400">
                    ¿Ya tienes una cuenta? 
                    <a class="text-primary font-bold hover:underline" href="#">Inicia sesión aquí</a>
</p>
</div>
<!-- Terms -->
<div class="mt-8 text-center px-4">
<p class="text-[10px] leading-relaxed text-slate-400 uppercase tracking-widest">
                    Al registrarte, aceptas nuestros <br/>
<span class="font-bold underline">Términos de Servicio</span> y <span class="font-bold underline">Política de Privacidad</span>
</p>
</div>
</div>
<!-- Footer Spacer -->
<div class="h-10 bg-transparent"></div>
</div>
</body></html>

<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>

<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
<!-- TopAppBar (Transactional Screen - Suppress Nav Shells except Header) -->
<header class="flex justify-between items-center w-full px-4 h-16 bg-surface dark:bg-inverse-surface border-b-0 shadow-none z-10 sticky top-0">
<button class="text-primary dark:text-inverse-primary hover:bg-surface-variant/50 dark:hover:bg-surface-variant/20 transition-colors p-2 rounded-full focus:outline-none">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline font-bold text-lg tracking-tight text-primary dark:text-inverse-primary">Nueva Propuesta</h1>
<button class="text-primary dark:text-inverse-primary hover:bg-surface-variant/50 dark:hover:bg-surface-variant/20 transition-colors p-2 rounded-full focus:outline-none">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</header>
<main class="flex-1 flex flex-col p-4 gap-6 max-w-md mx-auto w-full pb-24">
<!-- Product Summary Card -->
<section class="bg-surface-container-lowest rounded-xl shadow-sm p-4 flex gap-4 items-center">
<div class="w-20 h-20 rounded-lg overflow-hidden bg-surface-container flex-shrink-0">
<img alt="Saco de Café" class="w-full h-full object-cover" data-alt="A close-up shot of a burlap sack filled with freshly roasted, dark brown coffee beans. The lighting is warm and natural, highlighting the rich texture of the beans and the rough weave of the sack. The scene evokes a premium, artisanal agrarian aesthetic, fitting an organic farmer's market context. Earthy tones dominate." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDF1uvpU6uAS3dZhqbyOQpOyM97bXDSRlzcu4LSbvvoC0K51vi51R8sLZuEKofKA7TrQww6j7GUw4UCjKZ1XEv3aKPBDpNaKui_eV1DUTHBQNNOUaNj4hVBwOHsuFlPdBtPpHmR7ivJz6t62ecm_3M0pwwjh9CCponfDmGIKNPfwIW8KSbLYfihl07t-lhovIOVhlwX4NKWVHv6INsQiNbXqyiPt9IjZv6q5Koq8iYsNVKLM1a7ZX9qhW3gfbIgzRadX4kUC68tmrM"/>
</div>
<div class="flex flex-col flex-1">
<span class="text-[10px] font-label font-black text-secondary tracking-widest uppercase mb-1">Café Especial</span>
<h2 class="font-headline font-bold text-base text-on-surface leading-tight mb-1">Saco de Café (50kg)</h2>
<div class="flex items-center gap-1 text-on-surface-variant text-xs">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="font-medium">4.9</span>
<span class="mx-1 text-outline-variant">•</span>
<span>Antioquia</span>
</div>
</div>
</section>
<!-- Pricing Form -->
<section class="flex flex-col gap-5">
<!-- Unit Price -->
<div class="flex flex-col gap-2">
<label class="font-body font-semibold text-sm text-on-surface" for="unit_price">Precio por unidad (USD)</label>
<div class="relative flex items-center bg-surface-container-lowest rounded-xl shadow-sm overflow-hidden focus-within:ring-2 focus-within:ring-primary focus-within:ring-inset transition-all">
<div class="px-4 text-on-surface-variant font-medium">
<span class="material-symbols-outlined text-[20px]">attach_money</span>
</div>
<input class="w-full bg-transparent border-none text-on-surface font-body font-medium text-base py-3 pr-4 focus:ring-0 placeholder-on-surface-variant/50" id="unit_price" placeholder="0.00" type="number" value="150"/>
</div>
<div class="flex justify-between items-center text-xs px-1">
<span class="text-on-surface-variant font-medium">Precio Original: $165.00</span>
<span class="text-tertiary font-bold">-9%</span>
</div>
</div>
<!-- Quantity -->
<div class="flex flex-col gap-2">
<label class="font-body font-semibold text-sm text-on-surface" for="quantity">Cantidad (Sacos)</label>
<div class="flex items-center bg-surface-container-lowest rounded-xl shadow-sm overflow-hidden p-1">
<button class="w-10 h-10 flex items-center justify-center text-on-surface hover:bg-surface-container transition-colors rounded-lg focus:outline-none">
<span class="material-symbols-outlined">remove</span>
</button>
<input class="flex-1 text-center bg-transparent border-none text-on-surface font-headline font-bold text-lg focus:ring-0" id="quantity" type="number" value="10"/>
<button class="w-10 h-10 flex items-center justify-center text-on-surface hover:bg-surface-container transition-colors rounded-lg focus:outline-none">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>
<!-- Message -->
<div class="flex flex-col gap-2">
<label class="font-body font-semibold text-sm text-on-surface" for="message">Mensaje al comprador (Opcional)</label>
<textarea class="w-full bg-surface-container-lowest rounded-xl shadow-sm border-none text-on-surface font-body text-sm p-4 focus:ring-2 focus:ring-primary focus:ring-inset transition-all placeholder-on-surface-variant/50 resize-none" id="message" placeholder="Justifica tu nueva propuesta..." rows="3"></textarea>
</div>
</section>
<!-- Total Calculation -->
<section class="mt-4 bg-primary-container/5 rounded-xl p-5 border border-primary/10 flex flex-col gap-2">
<div class="flex justify-between items-center text-sm font-medium text-on-surface-variant">
<span>Subtotal (10 x $150)</span>
<span>$1,500.00</span>
</div>
<div class="flex justify-between items-center text-sm font-medium text-on-surface-variant">
<span>Costos de envío estimados</span>
<span>$50.00</span>
</div>
<hr class="border-outline-variant/20 my-2"/>
<div class="flex justify-between items-end">
<span class="font-headline font-bold text-base text-on-surface">Total de la Propuesta</span>
<span class="font-headline font-extrabold text-2xl text-primary">$1,550.00</span>
</div>
</section>
</main>
<!-- Bottom Action Bar (Fixed) -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest shadow-[0_-4px_20px_rgba(0,0,0,0.05)] p-4 pb-safe z-50">
<button class="w-full bg-primary-container text-on-primary-container font-headline font-bold text-sm tracking-wide uppercase py-4 rounded-xl shadow-md hover:bg-primary-container/90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]">send</span>
            Enviar Propuesta
        </button>
</div>
</body></html>

<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cambiar Idioma</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&amp;display=swap" rel="stylesheet"/>

<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f20d0d",
                        "background-light": "#f8f5f5",
                        "background-dark": "#221010",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col antialiased">
<!-- Header -->
<header class="flex items-center p-4 pb-2 justify-between sticky top-0 bg-background-light dark:bg-background-dark z-10 border-b border-primary/10 dark:border-primary/20">
<button aria-label="Go back" class="flex size-12 shrink-0 items-center justify-center text-slate-900 dark:text-slate-100 hover:text-primary dark:hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Cambiar Idioma</h1>

<div class="px-4 py-4">
<div class="relative flex w-full items-center rounded-lg bg-primary/10 dark:bg-primary/20 h-12">
<div class="flex items-center justify-center pl-4 text-primary shrink-0">
<span class="material-symbols-outlined text-[24px]">search</span>
</div>

</div>
</div>
<div class="px-4 pb-2 pt-2">

<!-- Language List -->
<div class="flex flex-col">
<!-- Spanish (Selected) -->
<button class="flex items-center gap-4 px-4 min-h-[4rem] justify-between hover:bg-primary/5 dark:hover:bg-primary/10 transition-colors w-full text-left group">
<div class="flex items-center gap-4 w-full">
<div class="flex items-center justify-center rounded-lg bg-primary/20 dark:bg-primary/30 text-primary shrink-0 size-10">
<span class="material-symbols-outlined text-[24px]">flag</span>
</div>
<p class="text-base font-medium leading-normal flex-1 truncate text-primary">Spanish</p>
</div>
<div class="shrink-0 text-primary">
<span class="material-symbols-outlined text-[24px]">check</span>
</div>
</button>
<div class="h-px bg-primary/10 dark:bg-primary/20 mx-4"></div>
<!-- English -->
<button class="flex items-center gap-4 px-4 min-h-[4rem] justify-between hover:bg-primary/5 dark:hover:bg-primary/10 transition-colors w-full text-left group">
<div class="flex items-center gap-4 w-full">
<div class="flex items-center justify-center rounded-lg bg-primary/10 dark:bg-primary/20 text-slate-600 dark:text-slate-400 shrink-0 size-10 group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[24px]">flag</span>
</div>
<p class="text-base font-normal leading-normal flex-1 truncate text-slate-700 dark:text-slate-300 group-hover:text-slate-900 dark:group-hover:text-slate-100 transition-colors">English</p>
</div>
</button>
<div class="h-px bg-primary/10 dark:bg-primary/20 mx-4"></div>
<!-- French -->
<button class="flex items-center gap-4 px-4 min-h-[4rem] justify-between hover:bg-primary/5 dark:hover:bg-primary/10 transition-colors w-full text-left group">

<div class="flex items-center justify-center rounded-lg bg-primary/10 dark:bg-primary/20 text-slate-600 dark:text-slate-400 shrink-0 size-10 group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[24px]">flag</span>
</div>
<p class="text-base font-normal leading-normal flex-1 truncate text-slate-700 dark:text-slate-300 group-hover:text-slate-900 dark:group-hover:text-slate-100 transition-colors">French</p>
</div>
</button>
<div class="h-px bg-primary/10 dark:bg-primary/20 mx-4"></div>
<!-- German -->
<button class="flex items-center gap-4 px-4 min-h-[4rem] justify-between hover:bg-primary/5 dark:hover:bg-primary/10 transition-colors w-full text-left group">
<div class="flex items-center gap-4 w-full">
<div class="flex items-center justify-center rounded-lg bg-primary/10 dark:bg-primary/20 text-slate-600 dark:text-slate-400 shrink-0 size-10 group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[24px]">flag</span>
</div>
<p class="text-base font-normal leading-normal flex-1 truncate text-slate-700 dark:text-slate-300 group-hover:text-slate-900 dark:group-hover:text-slate-100 transition-colors">German</p>
</div>
</button>
<div class="h-px bg-primary/10 dark:bg-primary/20 mx-4"></div>
<!-- Italian -->
<button class="flex items-center gap-4 px-4 min-h-[4rem] justify-between hover:bg-primary/5 dark:hover:bg-primary/10 transition-colors w-full text-left group">
<div class="flex items-center gap-4 w-full">
<div class="flex items-center justify-center rounded-lg bg-primary/10 dark:bg-primary/20 text-slate-600 dark:text-slate-400 shrink-0 size-10 group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[24px]">flag</span>
</div>
<p class="text-base font-normal leading-normal flex-1 truncate text-slate-700 dark:text-slate-300 group-hover:text-slate-900 dark:group-hover:text-slate-100 transition-colors">Italian</p>
</div>
</button>
<div class="h-px bg-primary/10 dark:bg-primary/20 mx-4"></div>
<!-- Portuguese -->
<button class="flex items-center gap-4 px-4 min-h-[4rem] justify-between hover:bg-primary/5 dark:hover:bg-primary/10 transition-colors w-full text-left group">
<div class="flex items-center gap-4 w-full">
<div class="flex items-center justify-center rounded-lg bg-primary/10 dark:bg-primary/20 text-slate-600 dark:text-slate-400 shrink-0 size-10 group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[24px]">flag</span>
</div>
<p class="text-base font-normal leading-normal flex-1 truncate text-slate-700 dark:text-slate-300 group-hover:text-slate-900 dark:group-hover:text-slate-100 transition-colors">Portuguese</p>
</div>
</button>
</div>
</main>

<nav class="fixed bottom-0 w-full border-t border-primary/10 dark:border-primary/20 bg-background-light dark:bg-background-dark px-4 pb-6 pt-2 z-20">

<a class="flex flex-1 flex-col items-center justify-end gap-1 text-slate-500 dark:text-slate-400 hover:text-primary dark:hover:text-primary transition-colors" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined text-[24px]">home</span>
</div>
<p class="text-xs font-medium leading-normal tracking-[0.015em]">Home</p>

<a class="flex flex-1 flex-col items-center justify-end gap-1 text-slate-500 dark:text-slate-400 hover:text-primary dark:hover:text-primary transition-colors" href="#">

<span class="material-symbols-outlined text-[24px]">search</span>
</div>
<p class="text-xs font-medium leading-normal tracking-[0.015em]">Search</p>

<span class="material-symbols-outlined text-[24px]">notifications</span>
</div>
<p class="text-xs font-medium leading-normal tracking-[0.015em]">Notifications</p>

<a class="flex flex-1 flex-col items-center justify-end gap-1 text-primary" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined text-[24px]">person</span>
</div>
<p class="text-xs font-medium leading-normal tracking-[0.015em]">Profile</p>
</a>
</div>

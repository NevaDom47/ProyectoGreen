<button class="flex-1 py-3 px-4 rounded-full bg-primary-container text-on-primary-container font-label font-bold text-[10px] uppercase tracking-widest hover:bg-primary hover:text-on-primary transition-colors shadow-sm">

<script>
        // Simple star rating interaction
        const stars = document.querySelectorAll('#star-rating span');
        stars.forEach(star => {
            star.addEventListener('click', (e) => {
                const value = parseInt(e.target.dataset.value);
                stars.forEach((s, index) => {
                    if (index < value) {
                        s.classList.add('filled', 'text-primary');
                        s.classList.remove('text-outline-variant');
                    } else {
                        s.classList.remove('filled', 'text-primary');
                        s.classList.add('text-outline-variant');
                    }
                });
            });
        });
    </script>

<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cambiar Contraseña</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f20d0d",
                        "background-light": "#f8f5f5",
                        "background-dark": "#221010",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden">
<!-- App Bar -->
<div class="flex items-center p-4 pb-2 justify-between">
<button aria-label="Go back" class="flex size-12 shrink-0 items-center justify-center text-slate-900 dark:text-slate-100 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-full transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h2 class="text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Cambiar Contraseña</h2>
</div>
<div class="flex-1 flex flex-col max-w-md mx-auto w-full">
<p class="text-base font-normal leading-normal pb-6 pt-2 px-4 text-slate-600 dark:text-slate-400">
                Ingresa tu contraseña actual y la nueva contraseña que deseas usar. Asegúrate de usar una contraseña segura.
            </p>
<form class="flex flex-col gap-4 px-4 pb-8 flex-1">
<!-- Current Password -->
<div class="flex flex-col w-full">
<label class="flex flex-col flex-1">
<span class="text-sm font-medium leading-normal pb-1.5 text-slate-700 dark:text-slate-300">Contraseña actual</span>
<div class="flex w-full items-stretch rounded-lg bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-l-lg bg-transparent text-slate-900 dark:text-slate-100 border-none focus:ring-0 h-12 placeholder:text-slate-400 p-[15px] text-base" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="flex items-center justify-center pr-[15px] pl-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</label>
</div>
<!-- New Password -->
<div class="flex flex-col w-full">
<label class="flex flex-col flex-1">
<span class="text-sm font-medium leading-normal pb-1.5 text-slate-700 dark:text-slate-300">Nueva contraseña</span>
<div class="flex w-full items-stretch rounded-lg bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-l-lg bg-transparent text-slate-900 dark:text-slate-100 border-none focus:ring-0 h-12 placeholder:text-slate-400 p-[15px] text-base" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="flex items-center justify-center pr-[15px] pl-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</label>
<p class="text-xs text-slate-500 dark:text-slate-400 mt-1.5 pl-1">Debe tener al menos 8 caracteres.</p>
</div>
<!-- Confirm New Password -->
<div class="flex flex-col w-full">
<label class="flex flex-col flex-1">
<span class="text-sm font-medium leading-normal pb-1.5 text-slate-700 dark:text-slate-300">Confirmar nueva contraseña</span>
<div class="flex w-full items-stretch rounded-lg bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-l-lg bg-transparent text-slate-900 dark:text-slate-100 border-none focus:ring-0 h-12 placeholder:text-slate-400 p-[15px] text-base" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="flex items-center justify-center pr-[15px] pl-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</label>
</div>
<div class="mt-auto pt-8 pb-4">
<button class="w-full flex items-center justify-center bg-primary hover:bg-primary/90 text-white h-12 rounded-full font-bold text-base transition-colors shadow-sm" type="submit">
                        Actualizar Contraseña
                    </button>
</div>
</form>
</div>
</div>
</body></html>

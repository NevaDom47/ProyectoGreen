<body class="bg-background text-on-background min-h-screen pb-24 md:pb-0">
<!-- TopAppBar -->
<header class="fixed top-0 w-full bg-surface dark:bg-surface-dim z-50 bg-surface-container-low dark:bg-surface-container">
<div class="flex items-center justify-between px-4 h-16 w-full z-50">
<button aria-label="Volver" class="p-2 -ml-2 rounded-full hover:bg-surface-variant/50 transition-colors text-primary dark:text-inverse-primary active:scale-95 transition-transform">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline font-bold text-[1.125rem] text-primary dark:text-inverse-primary">Agregar Producto</h1>
<button aria-label="Guardar" class="p-2 -mr-2 rounded-full hover:bg-surface-variant/50 transition-colors text-primary dark:text-inverse-primary active:scale-95 transition-transform">

</button>
</div>
</header>
<main class="pt-20 px-4 max-w-2xl mx-auto space-y-8">
<!-- Section: Real-time Preview -->
<section class="space-y-3">
<h2 class="font-headline font-bold text-lg text-primary">Vista Previa</h2>
<div class="bg-surface-container-lowest rounded-xl shadow-sm overflow-hidden relative">
<div class="h-48 w-full bg-surface-variant relative" data-alt="A close-up, high-saturation photograph of fresh organic tomatoes in a rustic wooden crate, bathed in natural, warm sunlight. The vibrant red of the tomatoes contrasts beautifully with the deep green leaves and the earthy tones of the crate. The scene evokes a sense of farm-to-table freshness and agricultural richness, consistent with a high-end digital agrarian aesthetic." style="background-image: url(&quot;https://lh3.googleusercontent.com/aida-public/AB6AXuDY7QtWDjEy6RbmqWdY9cuQhzNe6XWf7Z3jVbxwCxLD9zJGzt4u1YYZlUfVeZaXUVEs-WOXgD1N62kjV9yQpB4zWZTZsMT5401FvJYqleEj9Rg1ZeRYJwCMrhpmwLjW9n9UzlxfskMTJAHx7kiepMcZFcKkS27UgvO7_50d1pgLdqeIGFR6igBkNHysDj3iJIZAw7yCogw9afflE9rNTnEtoENZgg8x_N0ITz6dW2fBsQ0v3i7uRwKR&quot;);">

</div>
<div class="p-4 space-y-1">
<div class="flex justify-between items-start">
<div>
<h3 class="font-headline font-bold text-lg text-on-surface">Tomates Orgánicos</h3>
<p class="text-sm text-on-surface-variant">Vegetales frescos</p>
</div>
<div class="text-right">
<span class="font-headline font-bold text-lg text-primary">$2.50</span>
<span class="text-xs text-on-surface-variant">/ kg</span>
</div>
</div>
</div>
</div>
</section>
<!-- Section: Photo Upload -->
<section class="space-y-3">
<h2 class="font-headline font-bold text-lg text-primary">Fotografías</h2>
<div class="flex gap-4 overflow-x-auto hide-scrollbar pb-2">
<button class="flex-shrink-0 w-24 h-24 rounded-xl border-2 border-dashed border-outline-variant flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/30 transition-colors">
<span class="material-symbols-outlined mb-1">add_a_photo</span>
<span class="text-[10px] font-label font-black tracking-widest uppercase">Añadir</span>
</button>
<div class="flex-shrink-0 w-24 h-24 rounded-xl overflow-hidden relative shadow-sm">
<img class="w-full h-full object-cover" data-alt="A top-down view of freshly harvested green bell peppers arranged neatly on a dark wooden table. The lighting highlights the glossy texture and vibrant green color of the peppers. The composition is clean and focused, capturing the essence of organic produce ready for a local market." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCv3jV3L7cpRO9HHhAwc1zzNt0S_llbAIUGaXpbVaMB_U2jXRwE8hy8Sbt2hlP4U64bphnvVqdpf631X6lnfg_gpaDU1UlPGfs9je3le4DSo0PsI5sD262GoYyvYkXunxiURcx9rsUwtaI6qoVMlXL2XfCTnenvsfr1se3iUBH8BLZ5fzXRt1CHIPEn2CQNM8oNyQzjGoiJlp6vmiIvmRLkS8a7HvhE2baSdBU2XDKB_cKg3WSOADN8">

<span class="material-symbols-outlined text-[16px]">close</span>
</button>
</div>
</div>
</section>
<!-- Section: Basic Info -->
<section class="space-y-4">


<div class="space-y-1">
<label class="text-[10px] font-label font-black tracking-widest uppercase text-on-surface-variant ml-1" for="category">Categoría</label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border-none rounded-xl px-4 py-3 shadow-sm focus:ring-2 focus:ring-primary text-body text-on-surface appearance-none" id="category">
<option>Vegetales</option>
<option>Frutas</option>
<option>Lácteos</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
</section>
</main>
<!-- Bottom Action Button (Sticky) -->
<div class="fixed bottom-0 left-0 w-full p-4 bg-surface dark:bg-surface-dim shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-50 md:relative md:bg-transparent md:shadow-none md:mt-8">
<button class="w-full max-w-2xl mx-auto flex items-center justify-center gap-2 bg-primary-container text-on-primary-container py-4 rounded-xl shadow-lg active:scale-[0.98] transition-transform font-label font-black tracking-widest uppercase text-xs">
<span class="material-symbols-outlined">save</span>
            Guardar Producto
